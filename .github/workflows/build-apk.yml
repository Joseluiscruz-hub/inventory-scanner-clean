name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          mkdir -p app
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "FIREBASE_CONFIG_SOURCE=configured" >> "$GITHUB_ENV"
          elif [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/google-services.json
            echo "FIREBASE_CONFIG_SOURCE=configured" >> "$GITHUB_ENV"
          else
            echo "Firebase secret is not set. Using a CI-only placeholder."
            printf '%s\n' \
              '{' \
              '  "project_info": {' \
              '    "project_number": "000000000000",' \
              '    "firebase_url": "https://placeholder.firebaseio.com",' \
              '    "project_id": "placeholder-project-id",' \
              '    "storage_bucket": "placeholder-project-id.appspot.com"' \
              '  },' \
              '  "client": [{' \
              '    "client_info": {' \
              '      "mobilesdk_app_id": "1:000000000000:android:placeholder",' \
              '      "android_client_info": {' \
              '        "package_name": "com.joseluiscruz.capturainventario"' \
              '      }' \
              '    },' \
              '    "api_key": [{ "current_key": "placeholder" }]' \
              '  }],' \
              '  "configuration_version": "1"' \
              '}' > app/google-services.json
            echo "FIREBASE_CONFIG_SOURCE=ci-placeholder" >> "$GITHUB_ENV"
          fi
          python3 -m json.tool app/google-services.json > /dev/null

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Record Firebase configuration source
        run: |
          printf 'Firebase configuration: %s\n' "$FIREBASE_CONFIG_SOURCE" > app/build/outputs/apk/debug/FIREBASE-CONFIG.txt

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: InventoryScannerPro-debug-apk-${{ env.FIREBASE_CONFIG_SOURCE }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/FIREBASE-CONFIG.txt
          if-no-files-found: error
